<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%" class="cad-blueprint" aria-label="ARC Haven Courtyard Villa CAD Blueprint">
  <defs>
    <!-- Hatching pattern for concrete shear walls -->
    <pattern id="wallHatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="currentColor" stroke-opacity="0.25" stroke-width="1.2" />
    </pattern>
    <!-- Subtle architectural drafting grid -->
    <pattern id="draftingGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="40" y2="0" stroke="currentColor" stroke-opacity="0.06" stroke-width="0.75" />
      <line x1="0" y1="0" x2="0" y2="40" stroke="currentColor" stroke-opacity="0.06" stroke-width="0.75" />
      <circle cx="0" cy="0" r="1.5" fill="currentColor" fill-opacity="0.15" />
    </pattern>
    <pattern id="majorGrid" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="url(#draftingGrid)" />
      <line x1="0" y1="0" x2="200" y2="0" stroke="currentColor" stroke-opacity="0.12" stroke-width="1.2" stroke-dasharray="4,4" />
      <line x1="0" y1="0" x2="0" y2="200" stroke="currentColor" stroke-opacity="0.12" stroke-width="1.2" stroke-dasharray="4,4" />
    </pattern>
    <!-- North Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="currentColor" />
    </marker>
  </defs>
  
  <style>
    .cad-blueprint { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .dim-line { stroke: currentColor; stroke-opacity: 0.4; stroke-width: 0.8; stroke-dasharray: 2,2; }
    .dim-text { font-size: 11px; fill: currentColor; fill-opacity: 0.65; letter-spacing: 0.05em; font-family: ui-monospace, monospace; }
    .room-title { font-family: 'Cinzel', serif, Georgia; font-size: 14px; font-weight: 600; fill: currentColor; fill-opacity: 0.95; letter-spacing: 0.12em; }
    .room-sub { font-size: 10px; fill: currentColor; fill-opacity: 0.55; letter-spacing: 0.08em; font-family: ui-monospace, monospace; }
    .wall-solid { stroke: currentColor; stroke-width: 3.5; fill: url(#wallHatch); }
    .wall-interior { stroke: currentColor; stroke-width: 2.2; fill: none; }
    .door-arc { stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1; stroke-dasharray: 3,2; fill: none; }
    .fixture { stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; fill: none; }
    .column { fill: #C5A880; stroke: currentColor; stroke-width: 1.5; }
    .title-block { stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; fill: none; }
  </style>

  <!-- Background Drafting Grid -->
  <rect width="1200" height="820" fill="url(#majorGrid)" />

    <!-- Grid Reference Axes -->
    <g class="dim-line">
      <line x1="80" y1="120" x2="1120" y2="120" />
      <line x1="80" y1="360" x2="1120" y2="360" />
      <line x1="80" y1="580" x2="1120" y2="580" />
      <line x1="80" y1="720" x2="1120" y2="720" />
      
      <line x1="120" y1="80" x2="120" y2="760" />
      <line x1="420" y1="80" x2="420" y2="760" />
      <line x1="780" y1="80" x2="780" y2="760" />
      <line x1="1080" y1="80" x2="1080" y2="760" />
    </g>

    <!-- Structural Columns -->
    <g class="column">
      <rect x="112" y="112" width="16" height="20" rx="1" />
      <rect x="412" y="112" width="16" height="20" rx="1" />
      <rect x="772" y="112" width="16" height="20" rx="1" />
      <rect x="1072" y="112" width="16" height="20" rx="1" />

      <rect x="112" y="352" width="16" height="20" rx="1" />
      <rect x="412" y="352" width="16" height="20" rx="1" />
      <rect x="772" y="352" width="16" height="20" rx="1" />
      <rect x="1072" y="352" width="16" height="20" rx="1" />

      <rect x="112" y="572" width="16" height="20" rx="1" />
      <rect x="412" y="572" width="16" height="20" rx="1" />
      <rect x="772" y="572" width="16" height="20" rx="1" />
      <rect x="1072" y="572" width="16" height="20" rx="1" />

      <rect x="112" y="712" width="16" height="20" rx="1" />
      <rect x="412" y="712" width="16" height="20" rx="1" />
      <rect x="772" y="712" width="16" height="20" rx="1" />
      <rect x="1072" y="712" width="16" height="20" rx="1" />
    </g>

    <!-- Villa Perimeter Walls -->
    <path class="wall-solid" d="
      M 120 120 
      L 1080 120 
      L 1080 720 
      L 120 720 
      Z
    " />

    <!-- Central Open-to-Sky Courtyard (The Architectural Heart) -->
    <g>
      <rect x="460" y="280" width="280" height="240" stroke="#C5A880" stroke-width="2.5" fill="none" />
      <rect x="480" y="300" width="240" height="200" stroke="#C5A880" stroke-opacity="0.4" stroke-width="1.2" stroke-dasharray="4,4" fill="none" />
      <!-- Water Feature / Reflecting Basin in Courtyard -->
      <circle cx="600" cy="400" r="50" stroke="#C5A880" stroke-width="1.5" fill="none" />
      <circle cx="600" cy="400" r="40" stroke="currentColor" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="2,2" fill="none" />
      <text x="600" y="396" class="room-title" text-anchor="middle" fill="#C5A880">OPEN-TO-SKY</text>
      <text x="600" y="412" class="room-title" text-anchor="middle" fill="#C5A880">ZENITH COURTYARD</text>
      <text x="600" y="428" class="room-sub" text-anchor="middle">WATER REFLECTION BASIN</text>
    </g>

    <!-- 2-Car Portico (Front) -->
    <g>
      <rect x="120" y="120" width="280" height="180" stroke="#C5A880" stroke-width="1.5" stroke-dasharray="8,4" fill="none" />
      <text x="260" y="200" class="room-title" text-anchor="middle">COVERED CAR PORTICO</text>
      <text x="260" y="216" class="room-sub" text-anchor="middle">DUAL EV CHARGING STATION</text>
    </g>

    <!-- Formal Drawing Salon (Top Right) -->
    <g>
      <line x1="780" y1="120" x2="780" y2="280" stroke="currentColor" stroke-width="2.2" />
      <line x1="780" y1="280" x2="1080" y2="280" stroke="currentColor" stroke-width="2.2" />
      <text x="930" y="195" class="room-title" text-anchor="middle">FORMAL DRAWING ROOM</text>
      <text x="930" y="211" class="room-sub" text-anchor="middle">20'-0" × 16'-0" · HIGH APERTURES</text>
    </g>

    <!-- Family Living & Dining (Surrounding Courtyard) -->
    <g>
      <text x="270" y="410" class="room-title" text-anchor="middle">FAMILY LOUNGE</text>
      <text x="270" y="426" class="room-sub" text-anchor="middle">18'-0" × 15'-0"</text>

      <text x="930" y="410" class="room-title" text-anchor="middle">FORMAL DINING</text>
      <text x="930" y="426" class="room-sub" text-anchor="middle">18'-0" × 14'-0" · COURTYARD FACING</text>
    </g>

    <!-- Ground Floor Garden Suite & Chef Kitchen -->
    <g class="wall-interior">
      <line x1="120" y1="540" x2="420" y2="540" />
      <line x1="420" y1="540" x2="420" y2="720" />

      <line x1="780" y1="540" x2="1080" y2="540" />
      <line x1="780" y1="540" x2="780" y2="720" />
    </g>

    <g>
      <text x="270" y="630" class="room-title" text-anchor="middle">GROUND FLOOR SUITE</text>
      <text x="270" y="646" class="room-sub" text-anchor="middle">16'-0" × 14'-0" · GARDEN PATIO</text>

      <text x="930" y="630" class="room-title" text-anchor="middle">SHOW KITCHEN &amp; PANTRY</text>
      <text x="930" y="646" class="room-sub" text-anchor="middle">16'-0" × 12'-0"</text>
    </g>
  
  <!-- North Arrow Indicator -->
  <g transform="translate(1110, 180)">
    <circle cx="0" cy="0" r="26" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.2" fill="none" />
    <circle cx="0" cy="0" r="23" stroke="currentColor" stroke-opacity="0.15" stroke-width="0.75" stroke-dasharray="2,2" fill="none" />
    <!-- Compass Pointer -->
    <polygon points="0,-22 5,-4 0,0 -5,-4" fill="#C5A880" />
    <polygon points="0,22 5,4 0,0 -5,4" fill="currentColor" fill-opacity="0.3" />
    <text x="0" y="-28" text-anchor="middle" font-size="12" font-weight="700" fill="#C5A880" font-family="monospace">N</text>
    <text x="0" y="34" text-anchor="middle" font-size="9" fill="currentColor" fill-opacity="0.5" font-family="monospace">VASTU COMPLIANT</text>
  </g>

  <!-- Architectural Title Block -->
  <g transform="translate(80, 670)">
    <rect width="320" height="120" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2" fill="none" />
    <line x1="0" y1="36" x2="320" y2="36" stroke="currentColor" stroke-opacity="0.2" stroke-width="1" />
    <line x1="0" y1="80" x2="320" y2="80" stroke="currentColor" stroke-opacity="0.2" stroke-width="1" />
    <line x1="160" y1="80" x2="160" y2="120" stroke="currentColor" stroke-opacity="0.2" stroke-width="1" />
    
    <text x="14" y="24" font-family="'Cinzel', serif" font-size="14" font-weight="700" fill="#C5A880" letter-spacing="0.15em">ARC HAVEN // HYDERABAD</text>
    <text x="14" y="56" class="room-title" font-size="12">HAVEN VILLA — TYPE ALPHA</text>
    <text x="14" y="72" class="room-sub">4 BHK TRIPLEX COURTYARD ESTATE</text>
    
    <text x="14" y="96" class="room-sub">CARPET / USABLE</text>
    <text x="14" y="112" font-family="monospace" font-size="12" font-weight="700" fill="currentColor">3,800 SQ.FT (GROUND + 2 TIERS)</text>
    
    <text x="174" y="96" class="room-sub">ORIENTATION / SCALE</text>
    <text x="174" y="112" font-family="monospace" font-size="12" font-weight="700" fill="#C5A880">EAST FACING ENTRY · 1:50 @ A1</text>
  </g>

</svg>