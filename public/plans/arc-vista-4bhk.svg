<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%" class="cad-blueprint" aria-label="ARC Vista 4 BHK Signature Penthouse CAD Blueprint">
  <defs>
    <!-- Hatching pattern for concrete shear walls -->
    <pattern id="wallHatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="currentColor" stroke-opacity="0.25" stroke-width="1.2" />
    </pattern>
    <!-- Subtle architectural drafting grid -->
    <pattern id="draftingGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="40" y2="0" stroke="currentColor" stroke-opacity="0.06" stroke-width="0.75" />
      <line x1="0" y1="0" x2="0" y2="40" stroke="currentColor" stroke-opacity="0.06" stroke-width="0.75" />
      <circle cx="0" cy="0" r="1.5" fill="currentColor" fill-opacity="0.15" />
    </pattern>
    <pattern id="majorGrid" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="url(#draftingGrid)" />
      <line x1="0" y1="0" x2="200" y2="0" stroke="currentColor" stroke-opacity="0.12" stroke-width="1.2" stroke-dasharray="4,4" />
      <line x1="0" y1="0" x2="0" y2="200" stroke="currentColor" stroke-opacity="0.12" stroke-width="1.2" stroke-dasharray="4,4" />
    </pattern>
    <!-- North Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="currentColor" />
    </marker>
  </defs>
  
  <style>
    .cad-blueprint { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .dim-line { stroke: currentColor; stroke-opacity: 0.4; stroke-width: 0.8; stroke-dasharray: 2,2; }
    .dim-text { font-size: 11px; fill: currentColor; fill-opacity: 0.65; letter-spacing: 0.05em; font-family: ui-monospace, monospace; }
    .room-title { font-family: 'Cinzel', serif, Georgia; font-size: 14px; font-weight: 600; fill: currentColor; fill-opacity: 0.95; letter-spacing: 0.12em; }
    .room-sub { font-size: 10px; fill: currentColor; fill-opacity: 0.55; letter-spacing: 0.08em; font-family: ui-monospace, monospace; }
    .wall-solid { stroke: currentColor; stroke-width: 3.5; fill: url(#wallHatch); }
    .wall-interior { stroke: currentColor; stroke-width: 2.2; fill: none; }
    .door-arc { stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1; stroke-dasharray: 3,2; fill: none; }
    .fixture { stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; fill: none; }
    .column { fill: #C5A880; stroke: currentColor; stroke-width: 1.5; }
    .title-block { stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; fill: none; }
  </style>

  <!-- Background Drafting Grid -->
  <rect width="1200" height="820" fill="url(#majorGrid)" />

    <!-- Grid Reference Axes -->
    <g class="dim-line">
      <line x1="80" y1="120" x2="1120" y2="120" />
      <line x1="80" y1="360" x2="1120" y2="360" />
      <line x1="80" y1="580" x2="1120" y2="580" />
      <line x1="80" y1="730" x2="1120" y2="730" />
      
      <line x1="120" y1="80" x2="120" y2="760" />
      <line x1="420" y1="80" x2="420" y2="760" />
      <line x1="760" y1="80" x2="760" y2="760" />
      <line x1="1060" y1="80" x2="1060" y2="760" />
    </g>

    <!-- Column Grid Circles -->
    <g font-family="monospace" font-size="11" fill="currentColor" text-anchor="middle" dominant-baseline="central">
      <circle cx="120" cy="60" r="12" stroke="currentColor" stroke-opacity="0.4" fill="none" /><text x="120" y="60">A</text>
      <circle cx="420" cy="60" r="12" stroke="currentColor" stroke-opacity="0.4" fill="none" /><text x="420" y="60">B</text>
      <circle cx="760" cy="60" r="12" stroke="currentColor" stroke-opacity="0.4" fill="none" /><text x="760" y="60">C</text>
      <circle cx="1060" cy="60" r="12" stroke="currentColor" stroke-opacity="0.4" fill="none" /><text x="1060" y="60">D</text>

      <circle cx="50" cy="120" r="12" stroke="currentColor" stroke-opacity="0.4" fill="none" /><text x="50" y="120">01</text>
      <circle cx="50" cy="360" r="12" stroke="currentColor" stroke-opacity="0.4" fill="none" /><text x="50" y="360">02</text>
      <circle cx="50" cy="580" r="12" stroke="currentColor" stroke-opacity="0.4" fill="none" /><text x="50" y="580">03</text>
      <circle cx="50" cy="730" r="12" stroke="currentColor" stroke-opacity="0.4" fill="none" /><text x="50" y="730">04</text>
    </g>

    <!-- Structural Columns -->
    <g class="column">
      <rect x="112" y="112" width="16" height="20" rx="1" />
      <rect x="412" y="112" width="16" height="20" rx="1" />
      <rect x="752" y="112" width="16" height="20" rx="1" />
      <rect x="1052" y="112" width="16" height="20" rx="1" />

      <rect x="112" y="352" width="16" height="20" rx="1" />
      <rect x="412" y="352" width="16" height="20" rx="1" />
      <rect x="752" y="352" width="16" height="20" rx="1" />
      <rect x="1052" y="352" width="16" height="20" rx="1" />

      <rect x="112" y="572" width="16" height="20" rx="1" />
      <rect x="412" y="572" width="16" height="20" rx="1" />
      <rect x="752" y="572" width="16" height="20" rx="1" />
      <rect x="1052" y="572" width="16" height="20" rx="1" />

      <rect x="112" y="722" width="16" height="20" rx="1" />
      <rect x="412" y="722" width="16" height="20" rx="1" />
      <rect x="752" y="722" width="16" height="20" rx="1" />
      <rect x="1052" y="722" width="16" height="20" rx="1" />
    </g>

    <!-- Outer Structural Perimeter (Dual Aspect Penthouse) -->
    <path class="wall-solid" d="
      M 120 120 
      L 1060 120 
      L 1060 440 
      L 1140 440 
      L 1140 730 
      L 600 730 
      L 600 760 
      L 120 760 
      Z
    " />

    <!-- Cantilever Wrap-around Sky Deck -->
    <g>
      <rect x="760" y="440" width="380" height="290" stroke="#C5A880" stroke-width="1.8" stroke-dasharray="6,4" fill="none" />
      <line x1="1140" y1="440" x2="1140" y2="730" stroke="#C5A880" stroke-width="2.5" />
      <text x="950" y="600" class="room-title" text-anchor="middle" fill="#C5A880">WRAP-AROUND SKY DECK</text>
      <text x="950" y="618" class="room-sub" text-anchor="middle">38'-0" × 12'-0" · PANORAMIC GREENERY</text>
    </g>

    <!-- Partitions -->
    <g class="wall-interior">
      <!-- Private Lift Vestibule -->
      <rect x="120" y="120" width="140" height="140" stroke="currentColor" stroke-width="2" fill="none" />
      <!-- Grand Salon -->
      <line x1="260" y1="260" x2="760" y2="260" />
      <line x1="760" y1="120" x2="760" y2="440" />
      <!-- Master Sanctuary (Left Wing) -->
      <line x1="120" y1="460" x2="420" y2="460" />
      <line x1="420" y1="460" x2="420" y2="760" />
      <!-- Suite 02 & 03 (Top Right) -->
      <line x1="760" y1="280" x2="1060" y2="280" />
    </g>

    <!-- Labels -->
    <g>
      <text x="190" y="180" class="room-title" text-anchor="middle">PRIVATE LIFT</text>
      <text x="190" y="196" class="room-sub" text-anchor="middle">FOYER</text>

      <text x="510" y="340" class="room-title" text-anchor="middle">DOUBLE-HEIGHT GRAND SALON</text>
      <text x="510" y="358" class="room-sub" text-anchor="middle">32'-0" × 20'-0" · 18'-0" CEILING VOID</text>

      <text x="270" y="610" class="room-title" text-anchor="middle">MASTER SANCTUARY</text>
      <text x="270" y="628" class="room-sub" text-anchor="middle">24'-0" × 18'-0" · DRESSING + SPA ENSUITE</text>

      <text x="910" y="200" class="room-title" text-anchor="middle">BEDROOM 02 (SUITE)</text>
      <text x="910" y="216" class="room-sub" text-anchor="middle">16'-0" × 14'-0"</text>

      <text x="910" y="360" class="room-title" text-anchor="middle">BEDROOM 03</text>
      <text x="910" y="376" class="room-sub" text-anchor="middle">15'-0" × 13'-6"</text>
    </g>
  
  <!-- North Arrow Indicator -->
  <g transform="translate(1080, 180)">
    <circle cx="0" cy="0" r="26" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.2" fill="none" />
    <circle cx="0" cy="0" r="23" stroke="currentColor" stroke-opacity="0.15" stroke-width="0.75" stroke-dasharray="2,2" fill="none" />
    <!-- Compass Pointer -->
    <polygon points="0,-22 5,-4 0,0 -5,-4" fill="#C5A880" />
    <polygon points="0,22 5,4 0,0 -5,4" fill="currentColor" fill-opacity="0.3" />
    <text x="0" y="-28" text-anchor="middle" font-size="12" font-weight="700" fill="#C5A880" font-family="monospace">N</text>
    <text x="0" y="34" text-anchor="middle" font-size="9" fill="currentColor" fill-opacity="0.5" font-family="monospace">VASTU COMPLIANT</text>
  </g>

  <!-- Architectural Title Block -->
  <g transform="translate(80, 670)">
    <rect width="320" height="120" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2" fill="none" />
    <line x1="0" y1="36" x2="320" y2="36" stroke="currentColor" stroke-opacity="0.2" stroke-width="1" />
    <line x1="0" y1="80" x2="320" y2="80" stroke="currentColor" stroke-opacity="0.2" stroke-width="1" />
    <line x1="160" y1="80" x2="160" y2="120" stroke="currentColor" stroke-opacity="0.2" stroke-width="1" />
    
    <text x="14" y="24" font-family="'Cinzel', serif" font-size="14" font-weight="700" fill="#C5A880" letter-spacing="0.15em">ARC VISTA // HYDERABAD</text>
    <text x="14" y="56" class="room-title" font-size="12">PLAN 4B — SIGNATURE PENTHOUSE</text>
    <text x="14" y="72" class="room-sub">4 BEDROOM DUAL-ASPECT + PRIVATE SKY DECK</text>
    
    <text x="14" y="96" class="room-sub">CARPET / USABLE</text>
    <text x="14" y="112" font-family="monospace" font-size="12" font-weight="700" fill="currentColor">3,450 SQ.FT (2,820 NET CARPET)</text>
    
    <text x="174" y="96" class="room-sub">ORIENTATION / SCALE</text>
    <text x="174" y="112" font-family="monospace" font-size="12" font-weight="700" fill="#C5A880">NORTH-EAST CORNER · 1:50 @ A1</text>
  </g>

</svg>